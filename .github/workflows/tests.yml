name: tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  pytest:
    # The suite is pure-logic + persistence only — no macOS/PhotoKit needed,
    # so it runs on cheap Linux runners. macOS-only paths are marked @macos
    # and skipped here.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: >-
          python -m pytest -ra -m "not macos"
          --cov=photo_saver --cov-report=term-missing --cov-fail-under=85
